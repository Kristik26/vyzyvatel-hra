<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vědomostní Výzva</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: auto 0;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted);
            background: rgba(30, 41, 59, 0.7);
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            margin-right: 6px;
        }
        .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.error { background: var(--danger); }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.7rem;
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        h2 {
            font-size: 1.25rem;
            text-align: center;
        }

        p.sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .pin-input {
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 6px;
            font-weight: 700;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background: #334155;
        }

        button.danger-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 0.9rem;
            padding: 11px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }
        .divider:not(:empty)::before { margin-right: 12px; }
        .divider:not(:empty)::after { margin-left: 12px; }

        .pin-box {
            background: #0f172a;
            border: 2px dashed var(--primary);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .pin-code {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: #818cf8;
        }

        .players-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-chip {
            background: #0f172a;
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-chip.answered {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.15);
        }

        .question-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            border: 1px solid var(--card-border);
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ans-btn {
            text-align: left;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid transparent;
        }

        .ans-0 { background: #2563eb; }
        .ans-1 { background: #d97706; }
        .ans-2 { background: #059669; }
        .ans-3 { background: #7c3aed; }

        .ans-btn.selected {
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .leaderboard-row.me {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <div><span id="conn-dot" class="dot"></span><span id="conn-text">Připojování k serveru...</span></div>
        <div id="room-badge" class="hidden">PIN: <strong id="badge-pin">----</strong></div>
    </div>

    <!-- OBRAZOVKA 1: MENU -->
    <div id="screen-menu" class="card">
        <h1>VĚDOMOSTNÍ VÝZVA</h1>
        <p class="sub">Online kvíz pro 2 až 15+ hráčů (<span id="db-count">125</span> otázek)</p>

        <div>
            <label style="font-size:0.85rem; color:var(--muted); display:block; margin-bottom:6px;">Tvoje přezdívka:</label>
            <input type="text" id="player-name" placeholder="Např. Kristián" maxlength="16">
        </div>

        <button id="btn-create" onclick="createRoom()" disabled>Vytvořit novou hru</button>

        <div class="divider">NEBO SE PŘIPOJ</div>

        <input type="text" id="join-pin" class="pin-input" placeholder="PIN" maxlength="4" inputmode="numeric">
        <button id="btn-join" class="secondary" onclick="joinRoom()" disabled>Připojit se ke hře</button>
    </div>

    <!-- OBRAZOVKA 2: LOBBY -->
    <div id="screen-lobby" class="card hidden">
        <h2>Čekárna hráčů</h2>
        <div class="pin-box">
            <div style="font-size:0.8rem; color:var(--muted); margin-bottom:4px;">KÓD MÍSTNOSTI PRO PŘÁTELE</div>
            <div id="lobby-pin" class="pin-code">0000</div>
        </div>

        <div>
            <label style="font-size:0.85rem; color:var(--muted); display:block; margin-bottom:6px;">Počet otázek ve hře:</label>
            <select id="round-select" onchange="changeRoundsCount(this.value)">
                <option value="10">10 otázek (Rychlá hra)</option>
                <option value="15" selected>15 otázek (Standardní)</option>
                <option value="25">25 otázek (Dlouhá výzva)</option>
            </select>
        </div>

        <div>
            <div style="font-size:0.9rem; color:var(--muted); margin-bottom:8px;">
                Připojení hráči (<span id="lobby-count">0</span>):
            </div>
            <div id="lobby-players" class="players-grid"></div>
        </div>

        <button onclick="startGame()">Spustit hru pro všechny</button>
        <button class="danger-btn" onclick="leaveRoom()">Opustit místnost</button>
    </div>

    <!-- OBRAZOVKA 3: OTÁZKA -->
    <div id="screen-game" class="card hidden">
        <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:0.9rem;">
            <span id="round-info">Kolo 1 / 15</span>
            <span id="answered-info">Odpovědělo: 0 / 0</span>
        </div>

        <div id="question-text" class="question-box">Načítání otázky...</div>

        <div id="answers-container" class="answers-grid"></div>

        <div>
            <div style="font-size:0.8rem; color:var(--muted); margin-bottom:6px;">Stav hráčů v tomto kole:</div>
            <div id="game-players" class="players-grid"></div>
        </div>

        <button class="secondary" onclick="revealResults()" style="margin-top:8px; font-size:0.9rem; padding:12px;">
            Vyhodnotit kolo hned (nečekat)
        </button>
    </div>

    <!-- OBRAZOVKA 4: VÝSLEDKY KOLA / KONEC -->
    <div id="screen-results" class="card hidden">
        <h2 id="results-title">Výsledky kola</h2>
        <div id="correct-answer-box" style="background:rgba(34,197,94,0.15); border:1px solid var(--success); padding:12px; border-radius:12px; text-align:center; font-size:0.95rem;">
            Správná odpověď: <strong id="correct-answer-text">---</strong>
        </div>

        <div id="leaderboard" style="display:flex; flex-direction:column; gap:8px;"></div>

        <button id="btn-next-round" onclick="nextRound()">Další otázka</button>
        <button id="btn-new-game" class="hidden" onclick="restartGame()">Hrát znovu (nové otázky)</button>
    </div>
</div>

<script>

document.getElementById("db-count").innerText = QUESTIONS.length;

const BROKERS = [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://broker.hivemq.com:8884/mqtt"
];

let brokerIndex = 0;
let client = null;
let myId = localStorage.getItem("vv_pid") || "p_" + Math.random().toString(36).substring(2, 9);
localStorage.setItem("vv_pid", myId);

let myName = localStorage.getItem("vv_name") || "";
document.getElementById("player-name").value = myName;

let currentPin = null;
let gameState = null;
let players = {};
let usedQuestions = [];

function connectBroker() {
    const url = BROKERS[brokerIndex];
    client = mqtt.connect(url, {
        clientId: "vv_client_" + myId + "_" + Math.floor(Math.random() * 1000),
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2000
    });

    client.on("connect", () => {
        document.getElementById("conn-dot").className = "dot online";
        document.getElementById("conn-text").innerText = "Online – připraveno";
        document.getElementById("btn-create").disabled = false;
        document.getElementById("btn-join").disabled = false;

        if (currentPin) {
            subscribeToRoom(currentPin);
        }
    });

    client.on("error", () => {
        TryNextBroker();
    });

    client.on("offline", () => {
        document.getElementById("conn-dot").className = "dot";
        document.getElementById("conn-text").innerText = "Obnovování spojení...";
    });

    client.on("message", (topic, message) => {
        if (!currentPin) return;
        const msgStr = message.toString();
        if (!msgStr) return;

        try {
            const data = JSON.parse(msgStr);
            const prefix = `vyzyvatel_cz_26/${currentPin}/`;

            if (topic === prefix + "game") {
                gameState = data;
                if (gameState.qIndices) {
                    gameState.qIndices.forEach(idx => {
                        if (!usedQuestions.includes(idx)) usedQuestions.push(idx);
                    });
                }
                renderUI();
            } else if (topic.startsWith(prefix + "players/")) {
                const pid = topic.replace(prefix + "players/", "");
                if (data.left) {
                    delete players[pid];
                } else {
                    players[pid] = data;
                }
                checkAutoReveal();
                renderUI();
            }
        } catch (e) {
            console.error(e);
        }
    });
}

function TryNextBroker() {
    if (brokerIndex < BROKERS.length - 1) {
        brokerIndex++;
        if (client) client.end(true);
        connectBroker();
    }
}

function saveName() {
    const val = document.getElementById("player-name").value.trim();
    if (!val) {
        alert("Zadej prosím svou přezdívku!");
        return false;
    }
    myName = val;
    localStorage.setItem("vv_name", myName);
    return true;
}

function subscribeToRoom(pin) {
    const prefix = `vyzyvatel_cz_26/${pin}/`;
    client.subscribe(prefix + "game", { qos: 1 });
    client.subscribe(prefix + "players/+", { qos: 1 });
}

function publishGameState(state) {
    if (!currentPin) return;
    client.publish(`vyzyvatel_cz_26/${currentPin}/game`, JSON.stringify(state), { qos: 1, retain: true });
}

function publishMyPlayer(extra = {}) {
    if (!currentPin) return;
    const current = players[myId] || { id: myId, name: myName, score: 0, answeredRound: -1, answer: null };
    const updated = { ...current, name: myName, ...extra };
    players[myId] = updated;
    client.publish(`vyzyvatel_cz_26/${currentPin}/players/${myId}`, JSON.stringify(updated), { qos: 1, retain: true });
}

function getShuffledQuestionIndices(count = 15) {
    let available = QUESTIONS.map((_, i) => i).filter(i => !usedQuestions.includes(i));
    if (available.length < count) {
        usedQuestions = [];
        available = QUESTIONS.map((_, i) => i);
    }
    for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
    }
    const selected = available.slice(0, count);
    selected.forEach(idx => usedQuestions.push(idx));
    return selected;
}

function createRoom() {
    if (!saveName()) return;
    const pin = Math.floor(1000 + Math.random() * 9000).toString();
    currentPin = pin;
    players = {};

    subscribeToRoom(pin);

    const roundsCount = parseInt(document.getElementById("round-select").value) || 15;
    const initialGame = {
        pin: pin,
        status: "lobby",
        round: 0,
        roundsCount: roundsCount,
        qIndices: getShuffledQuestionIndices(roundsCount),
        updatedAt: Date.now()
    };

    publishGameState(initialGame);
    publishMyPlayer({ score: 0, answeredRound: -1, answer: null });
}

function changeRoundsCount(val) {
    const count = parseInt(val) || 15;
    if (gameState && gameState.status === "lobby") {
        publishGameState({
            ...gameState,
            roundsCount: count,
            qIndices: getShuffledQuestionIndices(count),
            updatedAt: Date.now()
        });
    }
}

function joinRoom() {
    if (!saveName()) return;
    const pin = document.getElementById("join-pin").value.trim();
    if (pin.length !== 4) {
        alert("Zadej 4místný PIN místnosti!");
        return;
    }
    currentPin = pin;
    players = {};
    subscribeToRoom(pin);
    publishMyPlayer({ score: 0, answeredRound: -1, answer: null });

    setTimeout(() => {
        if (!gameState) {
            const fallbackGame = {
                pin: pin,
                status: "lobby",
                round: 0,
                roundsCount: 15,
                qIndices: getShuffledQuestionIndices(15),
                updatedAt: Date.now()
            };
            publishGameState(fallbackGame);
        }
    }, 1500);
}

function leaveRoom() {
    if (currentPin) {
        const prefix = `vyzyvatel_cz_26/${currentPin}/`;
        client.publish(`${prefix}players/${myId}`, JSON.stringify({ left: true }), { qos: 1, retain: true });
        client.unsubscribe(prefix + "game");
        client.unsubscribe(prefix + "players/+");
    }
    currentPin = null;
    gameState = null;
    players = {};
    showScreen("screen-menu");
    document.getElementById("room-badge").classList.add("hidden");
}

function startGame() {
    if (!gameState) return;
    publishGameState({
        ...gameState,
        status: "playing",
        round: 0,
        updatedAt: Date.now()
    });
}

function submitAnswer(ansIndex) {
    if (!gameState || gameState.status !== "playing") return;
    const me = players[myId];
    if (me && me.answeredRound === gameState.round) return;

    const qIdx = gameState.qIndices[gameState.round];
    const question = QUESTIONS[qIdx];
    const isCorrect = (ansIndex === question.c);
    const newScore = (me ? me.score : 0) + (isCorrect ? 100 : 0);

    publishMyPlayer({
        score: newScore,
        answeredRound: gameState.round,
        answer: ansIndex
    });
}

function checkAutoReveal() {
    if (!gameState || gameState.status !== "playing") return;
    const pList = Object.values(players);
    if (pList.length === 0) return;

    const allAnswered = pList.every(p => p.answeredRound === gameState.round);
    if (allAnswered) {
        const sortedIds = Object.keys(players).sort();
        if (sortedIds[0] === myId) {
            setTimeout(() => {
                if (gameState && gameState.status === "playing") {
                    revealResults();
                }
            }, 400);
        }
    }
}

function revealResults() {
    if (!gameState) return;
    publishGameState({
        ...gameState,
        status: "results",
        updatedAt: Date.now()
    });
}

function nextRound() {
    if (!gameState) return;
    if (gameState.round + 1 >= gameState.qIndices.length) {
        publishGameState({
            ...gameState,
            status: "finished",
            updatedAt: Date.now()
        });
    } else {
        publishGameState({
            ...gameState,
            status: "playing",
            round: gameState.round + 1,
            updatedAt: Date.now()
        });
    }
}

function restartGame() {
    const count = (gameState && gameState.roundsCount) ? gameState.roundsCount : 15;
    // Reset skóre všem aktivním hráčům
    Object.values(players).forEach(p => {
        const resetPlayer = { ...p, score: 0, answeredRound: -1, answer: null };
        client.publish(`vyzyvatel_cz_26/${currentPin}/players/${p.id}`, JSON.stringify(resetPlayer), { qos: 1, retain: true });
    });

    publishGameState({
        pin: currentPin,
        status: "playing",
        round: 0,
        roundsCount: count,
        qIndices: getShuffledQuestionIndices(count),
        updatedAt: Date.now()
    });
}

function showScreen(id) {
    ["screen-menu", "screen-lobby", "screen-game", "screen-results"].forEach(s => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
    });
}

function renderUI() {
    if (!currentPin || !gameState) return;

    document.getElementById("room-badge").classList.remove("hidden");
    document.getElementById("badge-pin").innerText = currentPin;

    const pList = Object.values(players);

    if (gameState.status === "lobby") {
        showScreen("screen-lobby");
        document.getElementById("lobby-pin").innerText = currentPin;
        document.getElementById("lobby-count").innerText = pList.length;
        if (gameState.roundsCount) {
            document.getElementById("round-select").value = gameState.roundsCount.toString();
        }

        const container = document.getElementById("lobby-players");
        container.innerHTML = "";
        pList.forEach(p => {
            const chip = document.createElement("div");
            chip.className = "player-chip";
            chip.innerText = p.name + (p.id === myId ? " (Ty)" : "");
            container.appendChild(chip);
        });
    }

    else if (gameState.status === "playing") {
        showScreen("screen-game");
        const round = gameState.round;
        const total = gameState.qIndices.length;
        const qObj = QUESTIONS[gameState.qIndices[round]];

        const answeredCount = pList.filter(p => p.answeredRound === round).length;
        document.getElementById("round-info").innerText = `Otázka ${round + 1} / ${total}`;
        document.getElementById("answered-info").innerText = `Odpovědělo: ${answeredCount} / ${pList.length}`;
        document.getElementById("question-text").innerText = qObj.q;

        const me = players[myId];
        const myAnswered = me && me.answeredRound === round;

        const ansContainer = document.getElementById("answers-container");
        ansContainer.innerHTML = "";
        const letters = ["A", "B", "C", "D"];

        qObj.a.forEach((ansText, idx) => {
            const btn = document.createElement("button");
            btn.className = `ans-btn ans-${idx}` + (myAnswered && me.answer === idx ? " selected" : "");
            btn.disabled = myAnswered;
            btn.innerHTML = `<span>${letters[idx]})</span> <span>${ansText}</span>`;
            btn.onclick = () => submitAnswer(idx);
            ansContainer.appendChild(btn);
        });

        const gpContainer = document.getElementById("game-players");
        gpContainer.innerHTML = "";
        pList.forEach(p => {
            const done = p.answeredRound === round;
            const chip = document.createElement("div");
            chip.className = "player-chip" + (done ? " answered" : "");
            chip.innerText = (done ? "✓ " : "⏳ ") + p.name;
            gpContainer.appendChild(chip);
        });
    }

    else if (gameState.status === "results" || gameState.status === "finished") {
        showScreen("screen-results");
        const isFinished = gameState.status === "finished" || (gameState.round + 1 >= gameState.qIndices.length);
        const qObj = QUESTIONS[gameState.qIndices[gameState.round]];

        document.getElementById("results-title").innerText = isFinished ? "🏆 Konečné pořadí" : `Výsledky ${gameState.round + 1}. kola`;
        document.getElementById("correct-answer-text").innerText = qObj.a[qObj.c];

        const sorted = [...pList].sort((a, b) => (b.score || 0) - (a.score || 0));
        const lb = document.getElementById("leaderboard");
        lb.innerHTML = "";

        sorted.forEach((p, idx) => {
            const row = document.createElement("div");
            row.className = "leaderboard-row" + (p.id === myId ? " me" : "");
            const medal = idx === 0 ? "🥇 " : idx === 1 ? "🥈 " : idx === 2 ? "🥉 " : `${idx + 1}. `;
            const answeredCorrectly = (p.answeredRound === gameState.round && p.answer === qObj.c);
            row.innerHTML = `
                <div>
                    <strong>${medal}${p.name}</strong>
                    <span style="font-size:0.8rem; color:var(--muted); margin-left:6px;">
                        ${answeredCorrectly ? "(+100 b.)" : ""}
                    </span>
                </div>
                <div style="font-weight:800; color:#818cf8;">${p.score || 0} b.</div>
            `;
            lb.appendChild(row);
        });

        document.getElementById("btn-next-round").classList.toggle("hidden", isFinished);
        document.getElementById("btn-new-game").classList.toggle("hidden", !isFinished);
    }
}

connectBroker();
</script>
